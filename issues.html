<script id="snapshot" type="application/json">{"issues": [{"id": 1, "summary": "Scaffold: git init, Makefile, coco-libs shim, CG3 buff screen in XRoar, CREDITS, README", "description": "Gate for everything else. Create the standalone project skeleton in ~/github/bunny on the ~/github/coco Forth toolchain (see PLAN.md, Decisions and Build).\n\nBuild:\n- git init (commit to the default branch).\n- Makefile mirroring coco/make/demo.mk, which cannot be included because it hardcodes ../../ paths. Use COCO ?= $(HOME)/github/coco, FC = python3 $(COCO)/tools/fc.py, kernel map/bin at $(COCO)/kernel/build/kernel.{map,bin} (ROM mode, 32K), built via $(MAKE) -C $(COCO)/kernel when missing.\n- build/coco-libs.fs generated by make as absolute INCLUDE lines for $(COCO)/lib/{vdg,wavetable,async-sound,keyboard,rng,bye}.fs. fc.py resolves INCLUDE relative to the including file (tools/fc.py:255), and absolute paths work.\n- Targets: all, run (xroar -machine coco2bus -ram 32 -bas ~/.xroar/roms/bas12.rom -extbas ~/.xroar/roms/extbas11.rom -kbd-translate -run bunny.bin, same as demo.mk), cycles (fc.py --cycles), clean.\n- bunny.fs: 4 set-sam-v $C8 set-pia (CG3, CSS=1; per coco/src/vdg-modes/vdg-modes.fs:78 which uses V=4 and $C0 for CSS=0), fill the 3072 B CG3 VRAM at vram-base with 00 (buff), loop until BREAK, exit-basic. File must end with a call to main; comments ASCII only.\n- CREDITS.md with the required attribution: \"PixelFarm (https://bitbucket.org/tebruno99/pixelfarm) Stephen 'Redshrike' Challener\", licenses CC-BY 3.0 / CC-BY-SA 3.0 / OGA-BY 3.0, derived frames released CC-BY-SA 3.0.\n- README.md: what the demo is, prerequisites (coco checkout, lwasm, XRoar with ROMs, PIL), make run.\n\nVerify: pkill -9 xroar; make run; capture the XRoar window. Done when it shows a solid buff screen (confirms SAM V=4 / $C8).\n\nFollow-up when closing: file an issue in coco for coco-guides/vdg-modes.md:92, whose CG3 SAM V column says 011 but the working code uses 4 (100).\n\nResolution (2026-09-14): Makefile, build/coco-libs.fs shim, bunny.fs, CREDITS.md, README.md, .gitignore and git init are in place. The shim includes only bye.fs, because bye.fs already INCLUDEs vdg.fs and screen.fs; later issues add wavetable, async-sound, keyboard and rng as they need them. cg3-init uses 4 set-sam-v, vram-base 9 RSHIFT set-sam-f (offset 3), $C8 set-pia, and FILLs 3072 B with 0. App is 309 B at $3000. User confirmed a solid buff screen in XRoar, which confirms SAM V=4 and $C8 for CG3 CSS=1. Not done here: make issues target (#11). Screen capture was blocked by missing Screen Recording permission at the time; the user has since granted it.", "type": "feature", "status": "done", "priority": "high", "tags": ["build", "graphics"], "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 2, "summary": "png2cg.py converter + frames.json: 8 side-view frames to 2bpp data + preview.png", "description": "Depends on #1. Convert the LPC bunny sheet into CG3 sprite data (PLAN.md, Source art and Converter).\n\n- Download https://opengameart.org/sites/default/files/bunnysheet5.png into assets/ (321x327 RGBA, not a uniform grid).\n- tools/frames.json: crop boxes (x,y,w,h) for the side view. Hop cycle: (28,218,25,27) (59,216,26,28) (91,217,33,28) (134,218,29,25). Sit to munch: (179,218,26,25) (210,221,27,22) (243,224,28,19) (275,224,28,19). Also the color map and sequence names.\n- Anchor frames on the shared baseline (sheet y ~245, cell centre x) and store per-frame ox oy so the hop keeps its lift without jitter. Force ox even so 2x output lands on byte boundaries.\n- Color map (CSS=1): 00 buff = alpha 0, body (239,233,231), light grey (183,179,178); 01 cyan = outline (58,55,55), mid grey (130,124,124); 10 magenta = pink ear (214,179,157), browns (188,139,109) (196,145,114); 11 orange = tan nose (205,174,103). Nearest-color fallback. This mapping was test-rendered during planning and reads well.\n- Pad width to a multiple of 4, pack 2bpp MSB-first. Record = w h ox oy (4 B) then ceil(w/4)*h bytes. ~190 B per frame.\n- Emit build/sprites.fs as DATA[PY name bytes.fromhex(\"...\") ]DATA blocks (literal bytes, so no dependence on fc.py cwd; the exec is at tools/fc.py:366) plus a frame pointer table. Wire into the Makefile.\n- build/preview.png: every frame at 4x in CG3 CSS=1 colors on buff, grouped by sequence, anchor marked.\n\nOut of scope: patch records and hand-authored frames (#6).\nVerify: open preview.png; bunny.fs still compiles with sprites.fs included; check the reported app size.\n\nProgress (2026-09-14): tools/png2cg.py and tools/frames.json written; assets/bunnysheet5.png downloaded (sha256 f6f9d035...6f04). make builds build/sprites.fs and build/preview.png (make preview opens it). 8 frames, 1502 B total, no unmapped colors; app compiles to 1953 B at $3000. Generated Forth: DATA[PY spr-<name> blocks, spr-count, seq-hop/seq-munch index and length CONSTANTs, and spr ( n -- addr ). Anchor = sheet cell left (cell_x in frames.json) + 16 on baseline y=245. Cells: hop 24/56/88/120, munch 176/208/240/272. Observation for #4: hop4 sits about 12 px further forward than the other hop frames (ox -2 vs -12..-14), because the sheet bakes forward motion into that cell. The hop sequence's per-frame dx in #4 has to absorb this or the bunny will jump back when hop1 follows hop4. Fixed during review: the preview clipped hop4, so preview cells are now sized from frame extents. User reviewed preview.png and confirmed colors and alignment look right. Closed.", "type": "feature", "status": "done", "priority": "high", "tags": ["assets", "tools"], "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 3, "summary": "blit2x CODE word: opaque 2x blit, one static bunny frame on screen", "description": "Depends on #2. The core drawing primitive (PLAN.md, Rendering).\n\n- CODE blit2x ( spr x y flags -- ): reads a 1x 2bpp record and writes it opaque at 2x into CG3 VRAM (32 bytes per row, 96 rows). Each source byte expands through a 256-entry table of 16-bit doubled-pixel words; each source row is written to two VRAM rows. x,y are the anchor; apply ox oy.\n- Why not the kernel spr-draw (coco/kernel/kernel.asm ~:1980): it treats 00 as transparent and 00 is buff, the bunny body color, so the body would show through. It is also per-pixel and slow.\n- CODE words end with ;NEXT and preserve X (IP), U (data stack), S. Clip or document the valid x,y range.\n\nOut of scope: mirroring (flags bit 0, #8) and inline sound sampling (#5).\nVerify: draw hop frame 1 at a fixed spot; capture XRoar; it matches preview.png at 2x. Record make cycles cost for the word.\n\nProgress (2026-09-14): CODE blit2x in bunny.fs, with VARIABLEs vram, dbl-tab, blt-dst, blt-w, blt-h. png2cg.py now also emits dbl-table (512 B, hex literal; inline Python in DATA[PY was avoided because fc.py comment stripping eats ( ) there). main draws hop1 anchored at 32,80 and munch1 at 96,80. App 2646 B. fc.py --cycles: blit2x ~261 cy setup + ~92 cy per source row + ~44 cy per source byte, so hop1 (27 rows x 7 B) is ~11,000 cy, about 74% of a 14,917 cy frame. Tearing estimate for #4: CG3 rows are 2 scanlines, so source row k finishes near line 5+7k while the beam reaches it near line 70+2*top+4k; with top=26 the blit stays ahead of the beam for all rows. Inline sound sampling (#5) will shrink this margin. Verification tooling: the XRoar window was on another macOS Space (iTerm2 full screen), so screen-capture could not see it. Added make shot: headless XRoar (-ui null -ao null) traps at the SHOT_AT-th call of kernel CODE_VSYNC (address read from kernel.map), writes a raw .ram dump (XRoar FILETYPE_RAM), and tools/cg3shot.py renders the CG3 page at vram-base to build/shot.png. The shot shows both frames at 2x with correct palette and placement. User confirmed the live XRoar window matches the shot. Closed.", "type": "feature", "status": "done", "priority": "high", "tags": ["graphics", "asm"], "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 4, "summary": "Hop across the screen: frame table, VSYNC loop, trail erase, tearing check", "description": "Depends on #3. Retires the biggest timing unknown: whether single-buffer drawing tears.\n\n- Frame table entries (5 B): sprite index, dx, dy, duration (frames), sfx id (0 for now). Terminator byte marks the end of a sequence.\n- Main loop: vsync, draw what changed, advance animation. Hop frames 1-4 cycling, moving right with dx per hop, wrap or stop at the edge. Ground around row 88.\n- Trail erase: clear only the strip uncovered by dx with spr-erase-box (clears to 00 = buff), or a local opaque clear.\n- Timing: after VSYNC there are 70 lines before row 0 (kernel WAIT-PAST-ROW). Keep the bunny low enough that the blit finishes above the beam. Measure with make cycles.\n- If it tears: switch to a page flip using the second CG3 page inside the kernel-reserved $0600-$1DFF (6144 B = two 3072 B pages), following coco/src/clock/clock.fs set-sam-f-fast (:74) and flip-state (:136). Record which approach was chosen and why in this issue.\n\nVerify: several XRoar captures taken at random moments while hopping; no tearing or leftover pixels.\n\nProgress (2026-09-14): frames.json gains anims (entries: frame, dx, dy, hold, sfx); png2cg.py emits anim-<name> DATA blocks ended by 255 and rejects dx not a multiple of 4. Hop tuning: the nose sits at 1x x=10,10,15,24 across hop1-hop4, so one cycle carries the body 14 px (28 px at 2x); anim-hop is hop2 0, hop3 0, hop4 0, hop1 +28 (holds 6,6,6,24). At 2x the anchor can only range 28..84 before a frame leaves the screen (blit2x does not clip), so #4 does two hops then resets to x=28; hopping back is #8. bunny.fs adds CODE clear-rect, rect!/rect>old/erase-uncovered (clears the old rect minus the new, as four strips), queue/draw-pending/advance/tick. Timing: fc.py --cycles puts a frame change near 17k cy (rect! ~2.0k, erase-uncovered ~2.6k plus strip loops, blit2x ~11k) against 14,917 per frame. The first version did the Forth bookkeeping after vsync, delaying the blit ~90 lines, so the beam would overtake it around source row 8. Restructured: tick (before vsync) reads the entry, moves the anchor and runs rect!; draw-pending (after vsync) blits first, then erases, which is safe because erased strips are outside the new frame. Fixed make shot: -trap-range N means N onward, so dumps kept being overwritten until the trap timeout; now N-N. Headless shots at vsync 20/34/46/60/88/100/125 match the expected frame and position with no trails. Live XRoar captures (screen-capture MCP works once XRoar is on the current Space) showed clean mid-hop frames, and the user watched several cycles and confirmed no tearing. Single buffer kept; page flip not needed. Also: XRoar renders CSS=1 as white (255,255,255), teal-green (88,170,120), magenta (236,102,248), orange (238,121,74); frames.json preview_rgb and tools/cg3shot.py now use those. Closed.", "type": "feature", "status": "done", "priority": "high", "tags": ["graphics", "animation", "timing"], "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 5, "summary": "Sound in the loop: async-sound library, hop boing", "description": "Depends on #4. Retires the second unknown: sound pitch holding while drawing (PLAN.md, Rendering and Sound).\n\n- Background: coco/lib/async-sound.fs is one phase-accumulator voice on the $FF20 DAC, one sample per HSYNC by polling (interrupts are masked). freq>inc assumes ~262 samples per frame, so fewer samples lower the pitch. The sample demo loop 240 snd-fill (coco/src/sound-async/sound-async.fs main) runs slightly flat.\n- CODE fill-to-vsync: copy of snd-fill (async-sound.fs:168) that emits one sample per HSYNC until the $FF03 VSYNC flag is set, then returns. It should also wait correctly when the voice is idle. A noise twin modeled on snd-noise-fill (:244).\n- blit2x: inside the byte loop, test $FF01 and run an inline copy of the snd-poll sample body (async-sound.fs:104). snd-poll itself ends in ;NEXT and cannot be called from CODE.\n- Main loop: BEGIN fill-to-vsync draw-dirty snd-frame anim-tick ... UNTIL.\n- Boing on hop takeoff: sine wavetable (lib/wavetable.fs gen-sine into heap), snd-note with an upward snd-slide!, reversed at the apex frame via the sfx byte.\n\nVerify: a held 440 Hz test note sounds the same idle and while the bunny hops (by ear in XRoar); boing plays on each hop with no dropouts; captures still show no tearing.\nFollow-up when closing: file an issue in coco proposing fill-to-vsync for lib/async-sound.fs.\n\nScope change (2026-09-14, user decision): use lib/async-sound.fs as-is and keep it simple. A custom shared sample routine (fill-to-vsync plus per-byte sampling in blit2x) was tried and measured: the sample path is longer than a scan line at 0.895 MHz, so idle frames caught ~100 of 262 lines and blit passes caught denser, i.e. pitch would warble on redraw frames. The user judged exact pitch not worth that engineering for this demo; that code and its measurement tools were removed and not committed. Now: COCO_LIBS adds wavetable.fs and async-sound.fs; snd-setup runs snd-async-init and a gen-sine-hq table at $7000; main loop is vsync draw-pending snd-frame tick, then snd-playing? IF 80 snd-fill THEN. Sound pauses while a sprite frame redraws and pitch is lower than the nominal Hz; both accepted. anim entries' sfx byte now triggers effects (sfx word, 1 = boing) on the hop2 takeoff frame. Not doing: fill-to-vsync lib proposal (dropped with the custom routine). Tuned by ear with the user: first version (500 Hz nominal, slide +60) sounded like a frog; final boing is 1400 Hz nominal, attenuation 170 (1/3 volume), slide +220, env +6, 10 frames, ring mod period 9 for a metallic sproing. Ring mod persists in the library, so later effects must set 0 snd-ringmod! (#9). User: good enough. Closed.", "type": "feature", "status": "done", "priority": "high", "tags": ["sound", "asm", "timing"], "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 6, "summary": "Hand-authored art: carrot 0-3, nose wiggle patch, yawn, sleep, z", "description": "Depends on #2. The sheet only has hop and grass-munch frames; these are drawn by hand (PLAN.md, Source art).\n\n- assets/extra/*.png using only the 4 CG3 colors (or source colors that map cleanly): carrot0-3 (whole to eaten, ~12x16, orange body, cyan top), sleep (munch-low pose, eye closed), yawn, nose wiggle (1-2 px nose change on the sitting frame), z glyph.\n- Converter: add patch records (row col len bytes) against a base frame for wiggle and closed-eye variants to save memory; add the new frames to frames.json and preview.png.\n\nVerify: preview.png shows each new frame at 4x next to its base frame; app size still within the ROM-mode budget (~10K).\n\nProgress (2026-09-14): art is authored as ASCII pixel maps in assets/extra/*.txt instead of PNGs (easier to edit precisely and diff): . or w = buff, c = cyan, m = magenta, o = orange, # lines are comments. png2cg.py reads them (source_pixels/read_art); an art frame takes its anchor from a sheet frame via like, or explicit ox/oy. Frames appended after the 8 sheet frames, so existing indices are unchanged: wiggle (hop1 with nose up 1 px), yawn (hop1, eye closed, magenta open mouth), sleep (munch4, eye closed), carrot3..carrot0 (16x7, tip left toward the bunny, bites remove orange from the tip, greens stay; ox 0 oy -7), z (5x5, ox 0 oy -5). Eye pixels: hop1 (11,18) (12,17) (12,18); munch4 (11,21) (12,20) (12,21); closed = drop the top pixel. 16 frames, 2186 B; app 5405 B. Makefile sprite rule depends on assets/extra/*.txt. Preview sequences rest and carrot added. Not done: patch records (full frames are only ~600 B extra, well within budget). User reviewed the previews and closed it to judge the frames in motion during #7; redraws, if any, get filed then. Closed.", "type": "feature", "status": "done", "priority": "medium", "tags": ["assets"], "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 7, "summary": "Animation state machine: idle, wiggle, hop, eat carrot, yawn, sleep, wake", "description": "Depends on #4 and #6. Sequence the whole demo (PLAN.md, Animation engine).\n\n- A state VARIABLE and an IF chain (fc.py has no WHILE/REPEAT or CASE).\n- Loop: idle -> nose wiggle x2 -> hop right -> carrot appears -> munch frames 5-8 while the carrot steps 3/2/1/0 per bite -> yawn -> sleep with z rising through 3 positions -> wake -> (hop back is #8) -> repeat.\n- Carrot and z are separate small blits, redrawn only when they change.\n\nVerify: XRoar captures of each state; the full loop runs several times without drift or leftover pixels.\n\nProgress (2026-09-14): the whole show is data. frames.json anims are sub-scripts (sit, wiggle, hop, carrot, eat, yawn, doze, zzz, wake) spliced into anim-show with \"@name\" (png2cg.py expand, rejects undefined or self-including anims). The fifth entry byte is now an event id run before the move: 1 boing, 2 carrot bite, 3 carrot appears, 4 next z, 5 clear z, 6 scene reset. bunny.fs plays anim-show on a loop; no separate state variable or IF chain was needed. Layout: at 2x the anchor range is 28..84 and the carrot (32x14 at 2x) must fit, so the bunny hops once (28 to 56) and eats with the carrot at x=88, its tip just past the munch4 nose (x=80..83). Bunny frames are padded 4 px right of their pixels, so their rect overlaps the carrot's by one byte column; draw-pending redraws the carrot after every bunny draw. z rises through (96,56) (104,46) (112,36) and is drawn and cleared immediately in the event (tiny, never overlaps). same-frame? skips re-blitting an unchanged frame (e.g. consecutive sleep entries). Loop is ~752 passes (~12.5 s at 60 Hz). App 6286 B. Headless shots at passes 40/73/110/170/215/258/330/420/445/700/760 show each stage correctly with no leftovers. User feedback round 1 (2026-09-14), all applied: (a) nose pink: sheet nose color (205,174,103) maps to magenta, and the o nose pixels in wiggle/yawn/sleep.txt became m. (b) move toward the carrot while eating: munch3 chew entries step +8, +12, +4 after bites 1-3 (anchor 56 to 80); carrot stages use the new trim flag (png2cg trim_columns drops empty columns and moves ox), so stages start at x=88/96/108/112 and an opaque carrot blit never covers the nose; draw-carrot erases only the eaten strip (old left to new left, via carrot-was and carrot-left). z positions now follow bx and sit above the head: x = bx+8n, bottom y = 46-10n. (c) cyan grass: png2cg grass_rows makes a seeded 128x16 strip (2 solid base rows, random blades), emitted as DATA[PY grass and CMOVEd to rows 80-95 in cg3-init; all sprite rects end at row 80 so nothing ever erases it. App 6864 B. Shots at 40/170/215/225/240/247/258/268/330/420/445 and 758/761/765/790 all correct; pass 760 is the one frame between the scene-reset clear and the redraw. Until #8 the reset teleports the bunny from 80 back to 28. User watched the live loop: that's cool. Closed.", "type": "feature", "status": "done", "priority": "medium", "tags": ["animation"], "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 8, "summary": "Mirrored blit and hop back to the left", "description": "Depends on #3 and #7. flags bit 0 in blit2x mirrors the sprite using a 256-entry reverse-byte table (2bpp pairs reversed) plus reversed byte order per row, with ox negated. Add a hop-left sequence so the loop returns the bunny to its start.\n\nVerify: capture a left-facing frame and compare to a flipped preview.png; loop closes cleanly.\n\nProgress (2026-09-14): mirroring is done in the converter, not in blit2x. frames.json mirror frames (hop1l..hop4l) copy an earlier converted frame with rows reversed and ox = -(ox + w), so the anchor stays at the same screen x (png2cg mirror_frame). This avoids a reverse-byte table and per-byte work in the assembly blitter; cost is ~850 B of extra frame data. blit2x flags stays unused. Screen limits for left-facing frames at 2x: hop4l needs anchor >= 60 and hop3l >= 44, so hopback is: turn (hop1l at 80), full hop hop2l/hop3l/hop4l then hop1l -28 to 52, short hop hop2l/hop3l then hop1l -24 to 28 (no hop4l), turn right (hop1). Both hops play the boing. New event 7 (carrot-clear: erase carrot greens and z) replaces the teleporting scene reset on the sit entry; event 6 is kept but unused. 20 frames, 2997 B; app 7960 B of the ~10K ROM-mode budget, so #9 should watch size. Headless shots along the hop back and at passes 900/1000 show clean frames, the greens surviving the hop back, then clearing when the loop restarts. User watched the loop and closed it. Closed.", "type": "feature", "status": "done", "priority": "medium", "tags": ["graphics", "animation"], "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 9, "summary": "Remaining sound effects: sniff, crunch, snore, wake chirp", "description": "Depends on #5 and #7. Map sfx ids in the frame tables to effects (PLAN.md, Sound).\n\n- Sniff during wiggle: short noise bursts with rests.\n- Crunch per bite: ~5 frames of noise with decaying amp (pattern in coco/src/sound-async/sound-async.fs main loop).\n- Snore: 3 snd-shape (triangle), low note, snd-env! swell then fade, repeating in step with the z.\n- Wake chirp: short sine with a rising slide.\n\nVerify: listen in XRoar through a full loop; each sound lines up with its animation.\n\nProgress (2026-09-14): all four effects use lib/async-sound.fs only (per the #5 scope decision). sniff (event 8, on both wiggle entries): 3-frame noise burst, 24 samples/frame, div 1, att 190, fade +10. crunch (with bite, event 2): 6 frames, 40 samples/frame, div 2, att 140, fade +18. snore (with each new z, event 4): voice triangle (3 snd-shape), 110 Hz nominal, att 190, 24 frames, slide +2, env +3. chirp (event 9, first wake entry): sine 1800 nominal, att 180, 8 frames, slide +160, env +8. boing unchanged but now calls voice first. voice cancels any noise burst, reselects the sine table and turns ring mod off, because ring mod and waveform persist in the library. noise stops the voice, because snd-noise-fill shares snd-amp with it. The main loop's sound-step plays noise-n snd-noise-fill while a burst runs (fading snd-amp each frame), otherwise 80 snd-fill for the voice. App 8224 B. Headless shots at passes 225/445/800 still show the correct frames with bursts active. User listened and closed it without changes. Closed.", "type": "feature", "status": "done", "priority": "medium", "tags": ["sound"], "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 10, "summary": "Polish: random idle times, BREAK exit, README screenshot", "description": "Depends on #7. Idle duration from RND (60-180 frames, coco lib/rng.fs or kernel RND); BREAK restores text mode and calls exit-basic cleanly with the DAC at midpoint; add an XRoar capture to README.md.\n\nVerify: BREAK returns to the BASIC OK prompt; README renders with the screenshot.", "type": "chore", "status": "in-progress", "priority": "low", "tags": ["polish"], "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 11, "summary": "issues.html view: tools/issues_html.py and make issues target", "description": "Depends on #1. tools/issues_html.py was copied from the issues skill and issues.html generated when the tracker was created. Add a make issues target running: python3 tools/issues_html.py render issues.jsonl issues.html roadmap.jsonl --title=\"bunny issues\". Commit issues.html (do not gitignore it).\n\nVerify: headless Chrome --dump-dom shows one article.card per issue and one li.step per roadmap entry.", "type": "chore", "status": "open", "priority": "low", "tags": ["tooling"], "created": "2026-09-14", "updated": "2026-09-14"}], "roadmap": []}</script>
<script>
(function () {
  var STATUS_ORDER = ['open', 'in-progress', 'done', 'deferred', 'wontfix'];
  var PRIORITY_ORDER = ['high', 'medium', 'low'];
  var LIVE = ['open', 'in-progress'];
  var KEY = 'issues-view:' + location.pathname;
  // Longest alternative first: "jsonl" must win over "json".
  var PATH_RE = /\b((?:[\w.-]+\/)*[\w.-]+\.(?:jsonl|json|md|html|css|js|ts|tsx|jsx|py|rb|go|rs|java|c|h|cpp|sh|toml|ya?ml|cfg|ini|txt|bas|dsk|png))(:\d+(?:-\d+)?)?/g;

  var issues = [];
  var active = { status: [], type: [], tag: [] };
  var q = document.getElementById('q');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var empty = document.getElementById('empty');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function rank(v, order) {
    var i = order.indexOf(v);
    return i === -1 ? order.length : i;
  }

  function markup(text) {
    return String(text).split('\n\n').map(function (para) {
      return '<p>' + esc(para).replace(PATH_RE, '<code>$&</code>').replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }

  function summaryOf(i) { return i.summary || i.title || '(untitled)'; }
  function tagsOf(i) { return i.tags || i.labels || []; }

  function card(i) {
    var status = i.status || '?', priority = i.priority || '?', type = i.type || '?';
    var el = document.createElement('article');
    el.className = 'card';
    el.id = 'i' + i.id;
    el.dataset.status = status;
    el.dataset.type = type;
    el.dataset.tags = tagsOf(i).join(' ');
    el.innerHTML =
      '<header><button class="row" aria-expanded="false">' +
      '<span class="id">#' + esc(i.id) + '</span>' +
      '<span class="summary">' + esc(summaryOf(i)) + '</span>' +
      '<span class="chips">' +
        '<span class="chip st-' + esc(status) + '">' + esc(status) + '</span>' +
        '<span class="chip pr-' + esc(priority) + '">' + esc(priority) + '</span>' +
        '<span class="chip ty">' + esc(type) + '</span>' +
      '</span><span class="caret" aria-hidden="true"></span></button></header>' +
      '<div class="body" hidden><div class="desc">' +
      markup(i.description || '(no description)') + '</div><footer>' +
      tagsOf(i).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
      '<span class="meta"><code>' + esc(i.file || '-') + '</code> &middot; created ' +
      esc(i.created || '?') + ' &middot; updated ' + esc(i.updated || '?') +
      '</span></footer></div>';
    el.querySelector('.row').addEventListener('click', function () {
      setOpen(el, el.querySelector('.body').hidden);
    });
    return el;
  }

  function setOpen(el, open) {
    el.querySelector('.row').setAttribute('aria-expanded', open);
    el.querySelector('.body').hidden = !open;
  }

  // The roadmap stores only rank, id and why. Everything shown here is joined
  // from the tracker, so an entry pointing at a missing or finished issue is
  // visibly wrong rather than quietly stale.
  function drawRoadmap(plan, byId) {
    if (!plan.length) return;
    var host = document.getElementById('plan');
    plan.slice().sort(function (a, b) { return (a.rank || 0) - (b.rank || 0); })
      .forEach(function (e) {
        var issue = byId[e.id];
        var li = document.createElement('li');
        li.className = 'step';
        var head, warn = '';
        if (!issue) {
          head = '#' + esc(e.id) + ' is not in the tracker';
          warn = 'no such issue';
          li.className += ' bad';
        } else {
          head = '<a href="#i' + esc(e.id) + '">#' + esc(e.id) + ' ' +
                 esc(summaryOf(issue)) + '</a> <span class="chip st-' +
                 esc(issue.status) + '">' + esc(issue.status) + '</span>';
          if (LIVE.indexOf(issue.status) === -1) {
            warn = 'already ' + issue.status + ', take it off the roadmap';
            li.className += ' bad';
          }
        }
        li.innerHTML = '<span class="rank">' + esc(e.rank || '?') + '.</span>' +
          '<span class="what">' + head +
          '<span class="why">' + esc(e.why || '') + '</span>' +
          (warn ? '<span class="warn">' + esc(warn) + '</span>' : '') + '</span>';
        var link = li.querySelector('a');
        if (link) {
          link.addEventListener('click', function () {
            var target = document.getElementById('i' + e.id);
            if (target) { target.hidden = false; setOpen(target, true); }
          });
        }
        host.appendChild(li);
      });
    document.getElementById('roadmap').hidden = false;
  }

  function pills(host, filter, values, counts) {
    document.getElementById(host).innerHTML = values.map(function (v) {
      return '<button class="pill" data-filter="' + filter + '" data-value="' + esc(v) + '">' +
        esc(v) + (counts ? ' <span class="n">' + counts[v] + '</span>' : '') + '</button>';
    }).join('');
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ active: active, q: q.value }));
    } catch (e) {}
  }

  function apply() {
    var needle = q.value.trim().toLowerCase();
    var shown = 0;
    [].forEach.call(list.children, function (el) {
      var ok =
        (!active.status.length || active.status.indexOf(el.dataset.status) !== -1) &&
        (!active.type.length || active.type.indexOf(el.dataset.type) !== -1) &&
        (!active.tag.length || active.tag.some(function (t) {
          return el.dataset.tags.split(' ').indexOf(t) !== -1;
        })) &&
        (!needle || el.textContent.toLowerCase().indexOf(needle) !== -1);
      el.hidden = !ok;
      if (ok) shown++;
    });
    empty.hidden = shown !== 0;
    count.textContent = shown + ' of ' + issues.length + ' shown';
    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.setAttribute('aria-pressed', active[p.dataset.filter].indexOf(p.dataset.value) !== -1);
    });
    save();
  }

  function draw(data, plan, note) {
    issues = data.slice().sort(function (a, b) {
      return rank(a.status, STATUS_ORDER) - rank(b.status, STATUS_ORDER) ||
             rank(a.priority, PRIORITY_ORDER) - rank(b.priority, PRIORITY_ORDER) ||
             (a.id || 0) - (b.id || 0);
    });

    var counts = {}, byId = {};
    STATUS_ORDER.forEach(function (s) { counts[s] = 0; });
    issues.forEach(function (i) {
      counts[i.status] = (counts[i.status] || 0) + 1;
      byId[i.id] = i;
    });

    list.innerHTML = '';
    issues.forEach(function (i) { list.appendChild(card(i)); });
    drawRoadmap(plan || [], byId);

    pills('f-status', 'status', STATUS_ORDER.filter(function (s) { return counts[s]; }), counts);
    pills('f-type', 'type', unique(issues.map(function (i) { return i.type || '?'; })));
    pills('f-tag', 'tag', unique([].concat.apply([], issues.map(tagsOf))));

    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.addEventListener('click', function () {
        var l = active[p.dataset.filter], i = l.indexOf(p.dataset.value);
        if (i === -1) l.push(p.dataset.value); else l.splice(i, 1);
        apply();
      });
    });

    var open = (counts.open || 0) + (counts['in-progress'] || 0);
    document.getElementById('lede').innerHTML =
      issues.length + ' issues, ' + open + ' of them still open' +
      ((plan && plan.length) ? ', ' + plan.length + ' on the roadmap' : '') +
      '. Read from <code>issues.jsonl</code>.';
    if (note) {
      var n = document.getElementById('note');
      n.textContent = note;
      n.hidden = false;
    }

    try {
      var s = JSON.parse(localStorage.getItem(KEY) || '{}');
      if (s.active) active = s.active;
      if (s.q) q.value = s.q;
    } catch (e) {}

    apply();

    if (location.hash) {
      var target = document.querySelector(location.hash);
      if (target && target.classList.contains('card')) {
        target.hidden = false;
        setOpen(target, true);
        target.scrollIntoView();
      }
    }
  }

  function unique(a) {
    return a.filter(function (v, i) { return a.indexOf(v) === i; }).sort();
  }

  q.addEventListener('input', apply);
  document.getElementById('reset').addEventListener('click', function () {
    active = { status: [], type: [], tag: [] };
    q.value = '';
    apply();
  });
  document.getElementById('expand').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { if (!c.hidden) setOpen(c, true); });
  });
  document.getElementById('collapse').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { setOpen(c, false); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; apply(); }
  });

  function lines(text) {
    return text.split('\n').filter(function (l) { return l.trim(); }).map(JSON.parse);
  }

  function grab(name) {
    return fetch(name, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(lines);
  }

  // The live files first. Browsers refuse a file:// fetch, so fall back to the
  // snapshot baked in at build time and say which one is on screen. A missing
  // roadmap.jsonl is not an error: the section just stays hidden.
  grab('issues.jsonl')
    .then(function (data) {
      grab('roadmap.jsonl')
        .catch(function () { return []; })
        .then(function (plan) { draw(data, plan); });
    })
    .catch(function () {
      var snap = JSON.parse(document.getElementById('snapshot').textContent);
      draw(snap.issues, snap.roadmap,
        'Showing the snapshot saved when this page was last built, because the browser would ' +
        'not read the .jsonl files from disk. To see them live, serve the directory ' +
        '(python3 -m http.server) and open it over http, or rebuild this page.');
    });
})();
</script>
</body>
</html>
