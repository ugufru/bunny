<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>bunny issues</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #fbfaf7; --panel: #fff; --ink: #1b1a17; --dim: #6b6862; --line: #e3ded4;
  --accent: #8a4b2a; --accent-ink: #fff;
  --open: #b4541f; --inprog: #8a6d1f; --done: #3f6b3a; --defer: #4a5a75; --wont: #6b6862;
  --high: #a8322a; --med: #8a6d1f; --low: #6b6862;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16151a; --panel: #1e1d23; --ink: #ece8e1; --dim: #9b968d; --line: #32303a;
    --accent: #d98a5a; --accent-ink: #16151a;
    --open: #e08b52; --inprog: #d4b95e; --done: #8fc182; --defer: #93aad6; --wont: #9b968d;
    --high: #e5776c; --med: #d4b95e; --low: #9b968d;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.wrap { max-width: 60rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
h1 { font-size: 1.5rem; margin: 0 0 .2rem; letter-spacing: -.01em; }
h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em;
  color: var(--dim); margin: 0 0 .6rem; }
.lede { color: var(--dim); margin: 0 0 1.5rem; font-size: .9rem; }
.note { font-size: .8rem; color: var(--dim); background: var(--panel);
  border: 1px solid var(--line); border-left: 3px solid var(--med);
  border-radius: 6px; padding: .5rem .7rem; margin: 0 0 1.25rem; }
.roadmap { margin: 0 0 1.75rem; }
.plan { list-style: none; margin: 0; padding: 0; counter-reset: step; }
.step { display: flex; gap: .7rem; padding: .55rem .7rem; border: 1px solid var(--line);
  border-radius: 8px; background: var(--panel); margin-bottom: .35rem; }
.step .rank { font-variant-numeric: tabular-nums; color: var(--dim); font-size: .85rem; }
.step .what { flex: 1; }
.step a { color: inherit; font-weight: 550; text-decoration: none; }
.step a:hover { text-decoration: underline; text-decoration-color: var(--accent); }
.step .why { display: block; color: var(--dim); font-size: .84rem; margin-top: .15rem; }
.step.bad { border-color: var(--high); }
.step .warn { color: var(--high); font-size: .78rem; }
.controls {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: .75rem 0; border-bottom: 1px solid var(--line); margin-bottom: 1.25rem;
}
#q {
  width: 100%; padding: .6rem .75rem; font: inherit; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
}
#q:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.pills { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .6rem; align-items: center; }
.pills .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em;
  color: var(--dim); margin-right: .15rem; }
.pill {
  font: inherit; font-size: .8rem; padding: .2rem .6rem; cursor: pointer;
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 999px;
}
.pill:hover { border-color: var(--accent); }
.pill[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pill .n { opacity: .6; font-variant-numeric: tabular-nums; }
.bar { display: flex; gap: .75rem; align-items: center; margin-top: .6rem;
  font-size: .8rem; color: var(--dim); }
.bar button { font: inherit; background: none; border: 0; color: var(--accent);
  cursor: pointer; padding: 0; text-decoration: underline; }
#count { margin-right: auto; font-variant-numeric: tabular-nums; }
.card { background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; margin-bottom: .5rem; overflow: hidden; }
.card:target { outline: 2px solid var(--accent); }
.row {
  width: 100%; display: flex; gap: .7rem; align-items: baseline; text-align: left;
  font: inherit; color: inherit; background: none; border: 0;
  padding: .7rem .9rem; cursor: pointer;
}
.row:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.id { color: var(--dim); font-variant-numeric: tabular-nums; font-size: .85rem; min-width: 2.2rem; }
.summary { flex: 1; font-weight: 550; }
.chips { display: flex; gap: .3rem; flex-wrap: wrap; }
.chip { font-size: .7rem; text-transform: uppercase; letter-spacing: .04em;
  padding: .1rem .45rem; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; }
.st-open { color: var(--open); } .st-in-progress { color: var(--inprog); }
.st-done { color: var(--done); } .st-deferred { color: var(--defer); }
.st-wontfix { color: var(--wont); }
.pr-high { color: var(--high); } .pr-medium { color: var(--med); } .pr-low { color: var(--low); }
.ty { color: var(--dim); }
.caret { width: .55rem; height: .55rem; border-right: 2px solid var(--dim);
  border-bottom: 2px solid var(--dim); transform: rotate(45deg); transition: transform .15s; }
.row[aria-expanded="true"] .caret { transform: rotate(-135deg); }
.body { padding: 0 .9rem .9rem; border-top: 1px solid var(--line); }
.desc { max-width: 62ch; }
.desc p { margin: .8rem 0; }
code { font: .87em ui-monospace, SFMono-Regular, Menlo, monospace;
  background: color-mix(in srgb, var(--ink) 7%, transparent);
  padding: .05em .3em; border-radius: 3px; }
footer { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center;
  margin-top: .9rem; padding-top: .7rem; border-top: 1px dashed var(--line); }
.tag { font-size: .72rem; color: var(--dim); border: 1px solid var(--line);
  border-radius: 999px; padding: .05rem .45rem; }
.meta { margin-left: auto; font-size: .75rem; color: var(--dim); }
.empty { color: var(--dim); padding: 2rem 0; text-align: center; }
@media (max-width: 40rem) {
  .row { flex-wrap: wrap; } .summary { flex-basis: 100%; order: 2; }
  .chips { order: 3; } .meta { margin-left: 0; }
}
</style>

<script id="snapshot" type="application/json">{"issues": [{"id": 1, "summary": "Scaffold: git init, Makefile, coco-libs shim, CG3 buff screen in XRoar, CREDITS, README", "description": "Gate for everything else. Create the standalone project skeleton in ~/github/bunny on the ~/github/coco Forth toolchain (see PLAN.md, Decisions and Build).\n\nBuild:\n- git init (commit to the default branch).\n- Makefile mirroring coco/make/demo.mk, which cannot be included because it hardcodes ../../ paths. Use COCO ?= $(HOME)/github/coco, FC = python3 $(COCO)/tools/fc.py, kernel map/bin at $(COCO)/kernel/build/kernel.{map,bin} (ROM mode, 32K), built via $(MAKE) -C $(COCO)/kernel when missing.\n- build/coco-libs.fs generated by make as absolute INCLUDE lines for $(COCO)/lib/{vdg,wavetable,async-sound,keyboard,rng,bye}.fs. fc.py resolves INCLUDE relative to the including file (tools/fc.py:255), and absolute paths work.\n- Targets: all, run (xroar -machine coco2bus -ram 32 -bas ~/.xroar/roms/bas12.rom -extbas ~/.xroar/roms/extbas11.rom -kbd-translate -run bunny.bin, same as demo.mk), cycles (fc.py --cycles), clean.\n- bunny.fs: 4 set-sam-v $C8 set-pia (CG3, CSS=1; per coco/src/vdg-modes/vdg-modes.fs:78 which uses V=4 and $C0 for CSS=0), fill the 3072 B CG3 VRAM at vram-base with 00 (buff), loop until BREAK, exit-basic. File must end with a call to main; comments ASCII only.\n- CREDITS.md with the required attribution: \"PixelFarm (https://bitbucket.org/tebruno99/pixelfarm) Stephen 'Redshrike' Challener\", licenses CC-BY 3.0 / CC-BY-SA 3.0 / OGA-BY 3.0, derived frames released CC-BY-SA 3.0.\n- README.md: what the demo is, prerequisites (coco checkout, lwasm, XRoar with ROMs, PIL), make run.\n\nVerify: pkill -9 xroar; make run; capture the XRoar window. Done when it shows a solid buff screen (confirms SAM V=4 / $C8).\n\nFollow-up when closing: file an issue in coco for coco-guides/vdg-modes.md:92, whose CG3 SAM V column says 011 but the working code uses 4 (100).\n\nResolution (2026-09-14): Makefile, build/coco-libs.fs shim, bunny.fs, CREDITS.md, README.md, .gitignore and git init are in place. The shim includes only bye.fs, because bye.fs already INCLUDEs vdg.fs and screen.fs; later issues add wavetable, async-sound, keyboard and rng as they need them. cg3-init uses 4 set-sam-v, vram-base 9 RSHIFT set-sam-f (offset 3), $C8 set-pia, and FILLs 3072 B with 0. App is 309 B at $3000. User confirmed a solid buff screen in XRoar, which confirms SAM V=4 and $C8 for CG3 CSS=1. Not done here: make issues target (#11). Screen capture was blocked by missing Screen Recording permission at the time; the user has since granted it.", "type": "feature", "status": "done", "priority": "high", "tags": ["build", "graphics"], "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 2, "summary": "png2cg.py converter + frames.json: 8 side-view frames to 2bpp data + preview.png", "description": "Depends on #1. Convert the LPC bunny sheet into CG3 sprite data (PLAN.md, Source art and Converter).\n\n- Download https://opengameart.org/sites/default/files/bunnysheet5.png into assets/ (321x327 RGBA, not a uniform grid).\n- tools/frames.json: crop boxes (x,y,w,h) for the side view. Hop cycle: (28,218,25,27) (59,216,26,28) (91,217,33,28) (134,218,29,25). Sit to munch: (179,218,26,25) (210,221,27,22) (243,224,28,19) (275,224,28,19). Also the color map and sequence names.\n- Anchor frames on the shared baseline (sheet y ~245, cell centre x) and store per-frame ox oy so the hop keeps its lift without jitter. Force ox even so 2x output lands on byte boundaries.\n- Color map (CSS=1): 00 buff = alpha 0, body (239,233,231), light grey (183,179,178); 01 cyan = outline (58,55,55), mid grey (130,124,124); 10 magenta = pink ear (214,179,157), browns (188,139,109) (196,145,114); 11 orange = tan nose (205,174,103). Nearest-color fallback. This mapping was test-rendered during planning and reads well.\n- Pad width to a multiple of 4, pack 2bpp MSB-first. Record = w h ox oy (4 B) then ceil(w/4)*h bytes. ~190 B per frame.\n- Emit build/sprites.fs as DATA[PY name bytes.fromhex(\"...\") ]DATA blocks (literal bytes, so no dependence on fc.py cwd; the exec is at tools/fc.py:366) plus a frame pointer table. Wire into the Makefile.\n- build/preview.png: every frame at 4x in CG3 CSS=1 colors on buff, grouped by sequence, anchor marked.\n\nOut of scope: patch records and hand-authored frames (#6).\nVerify: open preview.png; bunny.fs still compiles with sprites.fs included; check the reported app size.", "type": "feature", "status": "in-progress", "priority": "high", "tags": ["assets", "tools"], "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 3, "summary": "blit2x CODE word: opaque 2x blit, one static bunny frame on screen", "description": "Depends on #2. The core drawing primitive (PLAN.md, Rendering).\n\n- CODE blit2x ( spr x y flags -- ): reads a 1x 2bpp record and writes it opaque at 2x into CG3 VRAM (32 bytes per row, 96 rows). Each source byte expands through a 256-entry table of 16-bit doubled-pixel words; each source row is written to two VRAM rows. x,y are the anchor; apply ox oy.\n- Why not the kernel spr-draw (coco/kernel/kernel.asm ~:1980): it treats 00 as transparent and 00 is buff, the bunny body color, so the body would show through. It is also per-pixel and slow.\n- CODE words end with ;NEXT and preserve X (IP), U (data stack), S. Clip or document the valid x,y range.\n\nOut of scope: mirroring (flags bit 0, #8) and inline sound sampling (#5).\nVerify: draw hop frame 1 at a fixed spot; capture XRoar; it matches preview.png at 2x. Record make cycles cost for the word.", "type": "feature", "status": "open", "priority": "high", "tags": ["graphics", "asm"], "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 4, "summary": "Hop across the screen: frame table, VSYNC loop, trail erase, tearing check", "description": "Depends on #3. Retires the biggest timing unknown: whether single-buffer drawing tears.\n\n- Frame table entries (5 B): sprite index, dx, dy, duration (frames), sfx id (0 for now). Terminator byte marks the end of a sequence.\n- Main loop: vsync, draw what changed, advance animation. Hop frames 1-4 cycling, moving right with dx per hop, wrap or stop at the edge. Ground around row 88.\n- Trail erase: clear only the strip uncovered by dx with spr-erase-box (clears to 00 = buff), or a local opaque clear.\n- Timing: after VSYNC there are 70 lines before row 0 (kernel WAIT-PAST-ROW). Keep the bunny low enough that the blit finishes above the beam. Measure with make cycles.\n- If it tears: switch to a page flip using the second CG3 page inside the kernel-reserved $0600-$1DFF (6144 B = two 3072 B pages), following coco/src/clock/clock.fs set-sam-f-fast (:74) and flip-state (:136). Record which approach was chosen and why in this issue.\n\nVerify: several XRoar captures taken at random moments while hopping; no tearing or leftover pixels.", "type": "feature", "status": "open", "priority": "high", "tags": ["graphics", "animation", "timing"], "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 5, "summary": "Sound in the loop: fill-to-vsync, inline sampling in blit2x, hop boing", "description": "Depends on #4. Retires the second unknown: sound pitch holding while drawing (PLAN.md, Rendering and Sound).\n\n- Background: coco/lib/async-sound.fs is one phase-accumulator voice on the $FF20 DAC, one sample per HSYNC by polling (interrupts are masked). freq>inc assumes ~262 samples per frame, so fewer samples lower the pitch. The sample demo loop 240 snd-fill (coco/src/sound-async/sound-async.fs main) runs slightly flat.\n- CODE fill-to-vsync: copy of snd-fill (async-sound.fs:168) that emits one sample per HSYNC until the $FF03 VSYNC flag is set, then returns. It should also wait correctly when the voice is idle. A noise twin modeled on snd-noise-fill (:244).\n- blit2x: inside the byte loop, test $FF01 and run an inline copy of the snd-poll sample body (async-sound.fs:104). snd-poll itself ends in ;NEXT and cannot be called from CODE.\n- Main loop: BEGIN fill-to-vsync draw-dirty snd-frame anim-tick ... UNTIL.\n- Boing on hop takeoff: sine wavetable (lib/wavetable.fs gen-sine into heap), snd-note with an upward snd-slide!, reversed at the apex frame via the sfx byte.\n\nVerify: a held 440 Hz test note sounds the same idle and while the bunny hops (by ear in XRoar); boing plays on each hop with no dropouts; captures still show no tearing.\nFollow-up when closing: file an issue in coco proposing fill-to-vsync for lib/async-sound.fs.", "type": "feature", "status": "open", "priority": "high", "tags": ["sound", "asm", "timing"], "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 6, "summary": "Hand-authored art: carrot 0-3, nose wiggle patch, yawn, sleep, z", "description": "Depends on #2. The sheet only has hop and grass-munch frames; these are drawn by hand (PLAN.md, Source art).\n\n- assets/extra/*.png using only the 4 CG3 colors (or source colors that map cleanly): carrot0-3 (whole to eaten, ~12x16, orange body, cyan top), sleep (munch-low pose, eye closed), yawn, nose wiggle (1-2 px nose change on the sitting frame), z glyph.\n- Converter: add patch records (row col len bytes) against a base frame for wiggle and closed-eye variants to save memory; add the new frames to frames.json and preview.png.\n\nVerify: preview.png shows each new frame at 4x next to its base frame; app size still within the ROM-mode budget (~10K).", "type": "feature", "status": "open", "priority": "medium", "tags": ["assets"], "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 7, "summary": "Animation state machine: idle, wiggle, hop, eat carrot, yawn, sleep, wake", "description": "Depends on #4 and #6. Sequence the whole demo (PLAN.md, Animation engine).\n\n- A state VARIABLE and an IF chain (fc.py has no WHILE/REPEAT or CASE).\n- Loop: idle -> nose wiggle x2 -> hop right -> carrot appears -> munch frames 5-8 while the carrot steps 3/2/1/0 per bite -> yawn -> sleep with z rising through 3 positions -> wake -> (hop back is #8) -> repeat.\n- Carrot and z are separate small blits, redrawn only when they change.\n\nVerify: XRoar captures of each state; the full loop runs several times without drift or leftover pixels.", "type": "feature", "status": "open", "priority": "medium", "tags": ["animation"], "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 8, "summary": "Mirrored blit and hop back to the left", "description": "Depends on #3 and #7. flags bit 0 in blit2x mirrors the sprite using a 256-entry reverse-byte table (2bpp pairs reversed) plus reversed byte order per row, with ox negated. Add a hop-left sequence so the loop returns the bunny to its start.\n\nVerify: capture a left-facing frame and compare to a flipped preview.png; loop closes cleanly.", "type": "feature", "status": "open", "priority": "medium", "tags": ["graphics", "animation"], "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 9, "summary": "Remaining sound effects: sniff, crunch, snore, wake chirp", "description": "Depends on #5 and #7. Map sfx ids in the frame tables to effects (PLAN.md, Sound).\n\n- Sniff during wiggle: short noise bursts with rests.\n- Crunch per bite: ~5 frames of noise with decaying amp (pattern in coco/src/sound-async/sound-async.fs main loop).\n- Snore: 3 snd-shape (triangle), low note, snd-env! swell then fade, repeating in step with the z.\n- Wake chirp: short sine with a rising slide.\n\nVerify: listen in XRoar through a full loop; each sound lines up with its animation.", "type": "feature", "status": "open", "priority": "medium", "tags": ["sound"], "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 10, "summary": "Polish: random idle times, BREAK exit, README screenshot", "description": "Depends on #7. Idle duration from RND (60-180 frames, coco lib/rng.fs or kernel RND); BREAK restores text mode and calls exit-basic cleanly with the DAC at midpoint; add an XRoar capture to README.md.\n\nVerify: BREAK returns to the BASIC OK prompt; README renders with the screenshot.", "type": "chore", "status": "open", "priority": "low", "tags": ["polish"], "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 11, "summary": "issues.html view: tools/issues_html.py and make issues target", "description": "Depends on #1. tools/issues_html.py was copied from the issues skill and issues.html generated when the tracker was created. Add a make issues target running: python3 tools/issues_html.py render issues.jsonl issues.html roadmap.jsonl --title=\"bunny issues\". Commit issues.html (do not gitignore it).\n\nVerify: headless Chrome --dump-dom shows one article.card per issue and one li.step per roadmap entry.", "type": "chore", "status": "open", "priority": "low", "tags": ["tooling"], "created": "2026-09-14", "updated": "2026-09-14"}], "roadmap": [{"rank": 1, "id": 2, "why": "Every drawing issue needs real sprite data, and preview.png checks the palette without the emulator.", "added": "2026-09-14"}, {"rank": 2, "id": 3, "why": "The core graphics primitive. Proves the data format and 2x scaling on the real mode.", "added": "2026-09-14"}, {"rank": 3, "id": 4, "why": "Retires the biggest unknown, single-buffer tearing versus page flip, which shapes all later drawing.", "added": "2026-09-14"}, {"rank": 4, "id": 5, "why": "Retires the second unknown, sound pitch holding during blits, before effects get built on it.", "added": "2026-09-14"}, {"rank": 5, "id": 6, "why": "Bulk art that unblocks the state machine (#7).", "added": "2026-09-14"}]}</script>
<script>
(function () {
  var STATUS_ORDER = ['open', 'in-progress', 'done', 'deferred', 'wontfix'];
  var PRIORITY_ORDER = ['high', 'medium', 'low'];
  var LIVE = ['open', 'in-progress'];
  var KEY = 'issues-view:' + location.pathname;
  // Longest alternative first: "jsonl" must win over "json".
  var PATH_RE = /\b((?:[\w.-]+\/)*[\w.-]+\.(?:jsonl|json|md|html|css|js|ts|tsx|jsx|py|rb|go|rs|java|c|h|cpp|sh|toml|ya?ml|cfg|ini|txt|bas|dsk|png))(:\d+(?:-\d+)?)?/g;

  var issues = [];
  var active = { status: [], type: [], tag: [] };
  var q = document.getElementById('q');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var empty = document.getElementById('empty');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function rank(v, order) {
    var i = order.indexOf(v);
    return i === -1 ? order.length : i;
  }

  function markup(text) {
    return String(text).split('\n\n').map(function (para) {
      return '<p>' + esc(para).replace(PATH_RE, '<code>$&</code>').replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }

  function summaryOf(i) { return i.summary || i.title || '(untitled)'; }
  function tagsOf(i) { return i.tags || i.labels || []; }

  function card(i) {
    var status = i.status || '?', priority = i.priority || '?', type = i.type || '?';
    var el = document.createElement('article');
    el.className = 'card';
    el.id = 'i' + i.id;
    el.dataset.status = status;
    el.dataset.type = type;
    el.dataset.tags = tagsOf(i).join(' ');
    el.innerHTML =
      '<header><button class="row" aria-expanded="false">' +
      '<span class="id">#' + esc(i.id) + '</span>' +
      '<span class="summary">' + esc(summaryOf(i)) + '</span>' +
      '<span class="chips">' +
        '<span class="chip st-' + esc(status) + '">' + esc(status) + '</span>' +
        '<span class="chip pr-' + esc(priority) + '">' + esc(priority) + '</span>' +
        '<span class="chip ty">' + esc(type) + '</span>' +
      '</span><span class="caret" aria-hidden="true"></span></button></header>' +
      '<div class="body" hidden><div class="desc">' +
      markup(i.description || '(no description)') + '</div><footer>' +
      tagsOf(i).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
      '<span class="meta"><code>' + esc(i.file || '-') + '</code> &middot; created ' +
      esc(i.created || '?') + ' &middot; updated ' + esc(i.updated || '?') +
      '</span></footer></div>';
    el.querySelector('.row').addEventListener('click', function () {
      setOpen(el, el.querySelector('.body').hidden);
    });
    return el;
  }

  function setOpen(el, open) {
    el.querySelector('.row').setAttribute('aria-expanded', open);
    el.querySelector('.body').hidden = !open;
  }

  // The roadmap stores only rank, id and why. Everything shown here is joined
  // from the tracker, so an entry pointing at a missing or finished issue is
  // visibly wrong rather than quietly stale.
  function drawRoadmap(plan, byId) {
    if (!plan.length) return;
    var host = document.getElementById('plan');
    plan.slice().sort(function (a, b) { return (a.rank || 0) - (b.rank || 0); })
      .forEach(function (e) {
        var issue = byId[e.id];
        var li = document.createElement('li');
        li.className = 'step';
        var head, warn = '';
        if (!issue) {
          head = '#' + esc(e.id) + ' is not in the tracker';
          warn = 'no such issue';
          li.className += ' bad';
        } else {
          head = '<a href="#i' + esc(e.id) + '">#' + esc(e.id) + ' ' +
                 esc(summaryOf(issue)) + '</a> <span class="chip st-' +
                 esc(issue.status) + '">' + esc(issue.status) + '</span>';
          if (LIVE.indexOf(issue.status) === -1) {
            warn = 'already ' + issue.status + ', take it off the roadmap';
            li.className += ' bad';
          }
        }
        li.innerHTML = '<span class="rank">' + esc(e.rank || '?') + '.</span>' +
          '<span class="what">' + head +
          '<span class="why">' + esc(e.why || '') + '</span>' +
          (warn ? '<span class="warn">' + esc(warn) + '</span>' : '') + '</span>';
        var link = li.querySelector('a');
        if (link) {
          link.addEventListener('click', function () {
            var target = document.getElementById('i' + e.id);
            if (target) { target.hidden = false; setOpen(target, true); }
          });
        }
        host.appendChild(li);
      });
    document.getElementById('roadmap').hidden = false;
  }

  function pills(host, filter, values, counts) {
    document.getElementById(host).innerHTML = values.map(function (v) {
      return '<button class="pill" data-filter="' + filter + '" data-value="' + esc(v) + '">' +
        esc(v) + (counts ? ' <span class="n">' + counts[v] + '</span>' : '') + '</button>';
    }).join('');
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ active: active, q: q.value }));
    } catch (e) {}
  }

  function apply() {
    var needle = q.value.trim().toLowerCase();
    var shown = 0;
    [].forEach.call(list.children, function (el) {
      var ok =
        (!active.status.length || active.status.indexOf(el.dataset.status) !== -1) &&
        (!active.type.length || active.type.indexOf(el.dataset.type) !== -1) &&
        (!active.tag.length || active.tag.some(function (t) {
          return el.dataset.tags.split(' ').indexOf(t) !== -1;
        })) &&
        (!needle || el.textContent.toLowerCase().indexOf(needle) !== -1);
      el.hidden = !ok;
      if (ok) shown++;
    });
    empty.hidden = shown !== 0;
    count.textContent = shown + ' of ' + issues.length + ' shown';
    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.setAttribute('aria-pressed', active[p.dataset.filter].indexOf(p.dataset.value) !== -1);
    });
    save();
  }

  function draw(data, plan, note) {
    issues = data.slice().sort(function (a, b) {
      return rank(a.status, STATUS_ORDER) - rank(b.status, STATUS_ORDER) ||
             rank(a.priority, PRIORITY_ORDER) - rank(b.priority, PRIORITY_ORDER) ||
             (a.id || 0) - (b.id || 0);
    });

    var counts = {}, byId = {};
    STATUS_ORDER.forEach(function (s) { counts[s] = 0; });
    issues.forEach(function (i) {
      counts[i.status] = (counts[i.status] || 0) + 1;
      byId[i.id] = i;
    });

    list.innerHTML = '';
    issues.forEach(function (i) { list.appendChild(card(i)); });
    drawRoadmap(plan || [], byId);

    pills('f-status', 'status', STATUS_ORDER.filter(function (s) { return counts[s]; }), counts);
    pills('f-type', 'type', unique(issues.map(function (i) { return i.type || '?'; })));
    pills('f-tag', 'tag', unique([].concat.apply([], issues.map(tagsOf))));

    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.addEventListener('click', function () {
        var l = active[p.dataset.filter], i = l.indexOf(p.dataset.value);
        if (i === -1) l.push(p.dataset.value); else l.splice(i, 1);
        apply();
      });
    });

    var open = (counts.open || 0) + (counts['in-progress'] || 0);
    document.getElementById('lede').innerHTML =
      issues.length + ' issues, ' + open + ' of them still open' +
      ((plan && plan.length) ? ', ' + plan.length + ' on the roadmap' : '') +
      '. Read from <code>issues.jsonl</code>.';
    if (note) {
      var n = document.getElementById('note');
      n.textContent = note;
      n.hidden = false;
    }

    try {
      var s = JSON.parse(localStorage.getItem(KEY) || '{}');
      if (s.active) active = s.active;
      if (s.q) q.value = s.q;
    } catch (e) {}

    apply();

    if (location.hash) {
      var target = document.querySelector(location.hash);
      if (target && target.classList.contains('card')) {
        target.hidden = false;
        setOpen(target, true);
        target.scrollIntoView();
      }
    }
  }

  function unique(a) {
    return a.filter(function (v, i) { return a.indexOf(v) === i; }).sort();
  }

  q.addEventListener('input', apply);
  document.getElementById('reset').addEventListener('click', function () {
    active = { status: [], type: [], tag: [] };
    q.value = '';
    apply();
  });
  document.getElementById('expand').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { if (!c.hidden) setOpen(c, true); });
  });
  document.getElementById('collapse').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { setOpen(c, false); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; apply(); }
  });

  function lines(text) {
    return text.split('\n').filter(function (l) { return l.trim(); }).map(JSON.parse);
  }

  function grab(name) {
    return fetch(name, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(lines);
  }

  // The live files first. Browsers refuse a file:// fetch, so fall back to the
  // snapshot baked in at build time and say which one is on screen. A missing
  // roadmap.jsonl is not an error: the section just stays hidden.
  grab('issues.jsonl')
    .then(function (data) {
      grab('roadmap.jsonl')
        .catch(function () { return []; })
        .then(function (plan) { draw(data, plan); });
    })
    .catch(function () {
      var snap = JSON.parse(document.getElementById('snapshot').textContent);
      draw(snap.issues, snap.roadmap,
        'Showing the snapshot saved when this page was last built, because the browser would ' +
        'not read the .jsonl files from disk. To see them live, serve the directory ' +
        '(python3 -m http.server) and open it over http, or rebuild this page.');
    });
})();
</script>
</body>
</html>
